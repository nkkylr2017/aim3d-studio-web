<html lang="ar" dir="rtl">
<head>

<title>استوديو AIM للمجسمات</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e6a6e'/%3E%3Cpath d='M6 21h20v4H6zM8 14h16a2 2 0 0 1 2 2v5H6v-5a2 2 0 0 1 2-2zM9 8h6v6H9z' fill='%23fff'/%3E%3C/svg%3E">
<script>
  // Errors are reported to the SketchUp extension (when the page runs inside it), so a problem in SketchUp's own
  // browser can be read from its log. A classic script: it runs even when a module fails to load.
  (function () {
    var sent = 0;
    function send(kind, msg) {
      if (sent > 50 || !/host=sketchup/.test(location.search)) return;
      var tries = 0;
      (function go() {
        if (window.sketchup && window.sketchup.aim3d_log) { sent++; window.sketchup.aim3d_log(JSON.stringify({ kind: kind, msg: String(msg).slice(0, 2000) })); }
        else if (tries++ < 80) setTimeout(go, 100);
      })();
    }
    window.addEventListener('error', function (e) { send('error', (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); }, true);
    window.addEventListener('unhandledrejection', function (e) { send('rejection', e.reason && (e.reason.stack || e.reason.message) || e.reason); });
    window.aim3dReport = send;
    // Inside SketchUp there is no offline mode: its browser's Cache Storage never answers, and a service worker
    // installed by an earlier visit would make the page wait for it. Remove it, and reload once if it was in control.
    if (/host=sketchup/.test(location.search) && navigator.serviceWorker) {
      var controlled = !!navigator.serviceWorker.controller;
      var done = function () { if (controlled && !/[?&]nosw=1/.test(location.search)) location.replace(location.href + '&nosw=1'); };
      try {
        Promise.race([
          navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
          new Promise(function (ok) { setTimeout(ok, 1500); })
        ]).then(done, done);
      } catch (e) { done(); }
    }
  })();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  :root {
    color-scheme: light;
    --studio: #e4e8eb;
    --studio-low: #c9cfd4;
    --panel: #fbfbfc;
    --ink: #1f2b35;
    --muted: #5b6a76;
    --rule: #d5dbe0;
    --field: #ffffff;
    --accent: #2e6a6e;
    --accent-soft: #e3eeee;
    --bad: #a33a2a;
    --radius-s: 6px;
    --radius-m: 10px;
    --font: "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--panel); color: var(--ink); font: 15px/1.5 var(--font); }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  .panel { overflow-y: auto; padding: 22px 22px 28px; border-inline-end: 1px solid var(--rule); background: var(--panel); }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 21px; line-height: 1.25; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 13.5px; }
  .lang { flex: none; border: 1px solid var(--rule); background: var(--field); color: var(--ink); border-radius: var(--radius-s); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  section { padding: 16px 0; border-top: 1px solid var(--rule); }
  h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
  .drop { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 14px; padding: 12px; border: 1.5px dashed #a9b3bb; border-radius: var(--radius-m); background: var(--field); cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop .pic { width: 72px; height: 72px; border-radius: var(--radius-s); background: var(--studio) center / cover no-repeat; display: grid; place-items: center; overflow: hidden; }
  .drop .pic img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .drop.has .pic img { display: block; }
  .drop .pic svg { width: 30px; height: 30px; color: var(--muted); }
  .drop.has .pic svg { display: none; }
  .drop b { display: block; font-weight: 600; font-size: 14px; }
  .drop small { color: var(--muted); font-size: 12.5px; }
  .drop .when-has { display: none; } .drop.has .when-has { display: inline; } .drop.has .when-empty { display: none; }
  .note { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .note.bad { color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field .name { font-size: 13.5px; }
  .seen { font-style: normal; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; margin-inline-start: 4px; }
  select, input[type=text], input[type=password] { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 7px 9px; }
  .sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sizes label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .sizes input { direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .choice { display: flex; gap: 6px; flex-wrap: wrap; }
  .choice label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 6px 10px; background: var(--field); font-size: 13.5px; cursor: pointer; }
  .choice input:disabled + span { color: #9aa5ae; }
  .choice-set { border: 0; padding: 0; margin: 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; cursor: pointer; }
  .check[hidden] { display: none; }
  .analysis { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; font-size: 13.5px; }
  .analysis[hidden] { display: none; }
  .analysis h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted, #667); }
  .analysis .an-name { margin: 0 0 4px; font-weight: 600; }
  .analysis ul { margin: 6px 0; padding-inline-start: 18px; }
  .analysis li { margin: 2px 0; line-height: 1.5; }
  .analysis .an-issues li { color: var(--bad, #b3261e); }
  .analysis .an-by { margin: 6px 0 0; font-size: 11.5px; opacity: .65; }
  .row.wrap { flex-wrap: wrap; }
  .views { margin: 10px 0; }
  .views .name { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 64px;
    border: 1px dashed var(--rule); border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; overflow: hidden; text-align: center; padding: 4px; }
  .slot.has { border-style: solid; }
  .slot img { width: 100%; height: 56px; object-fit: contain; }
  .slot img[hidden] { display: none; }
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
  .cands[hidden] { display: none; }
  .cand { border: 1px solid var(--rule); border-radius: 8px; padding: 6px; font-size: 12.5px; }
  .cand.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .cand img { width: 100%; border-radius: 4px; display: block; }
  .cand p { margin: 6px 0 2px; }
  .cand p.bad { color: var(--bad); }
  .judge-list { margin: 6px 0; padding-inline-start: 18px; font-size: 13px; }
  .judge-list[hidden] { display: none; }
  .judge-list li { margin: 4px 0; line-height: 1.5; }
  .judge-list .hint { margin-top: 2px; }
  .tools { position: absolute; top: 18px; right: 22px; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: 0 1px 4px rgb(0 0 0 / .12); z-index: 3; }
  html[dir=rtl] .tools { right: auto; left: 22px; }
  .tools[hidden] { display: none; }
  .tool { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .tool:hover { background: var(--field); }
  .tool.on { background: var(--ink); color: var(--panel); }
  .tool:disabled { opacity: .35; cursor: default; }
  .tools .sep { width: 1px; background: var(--rule); margin: 4px 2px; }
  .parts { list-style: none; margin: 6px 0; padding: 0; max-height: 190px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
  .parts li { display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
  .parts li:last-child { border-bottom: 0; }
  .parts li.on { background: color-mix(in srgb, #9ccbf7 40%, transparent); }
  .parts li.off .pname { opacity: .45; }
  .parts .pname { flex: 1; text-align: start; border: 0; background: transparent; font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; color: var(--ink); }
  .parts .eye { border: 0; background: transparent; font-size: 13px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  #partFields .name { display: block; margin: 8px 0 4px; font-size: 12.5px; color: var(--muted); }
  .cut-box { margin-top: 8px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; }
  .cut-box[hidden] { display: none; }
  .cut-box .row { align-items: center; gap: 4px; }
  .cut-box input[type=range] { width: 100%; margin: 8px 0; }
  .lasso { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; cursor: crosshair; touch-action: none; }
  .lasso[hidden] { display: none; }
  .profile-box[hidden] { display: none; }
  .profile-svg { width: 100%; max-width: 260px; aspect-ratio: 1; display: block; margin: 6px auto; background: var(--field); border: 1px solid var(--rule); border-radius: 8px; touch-action: none; }
  .profile-svg .axis { stroke: var(--rule); stroke-dasharray: 4 4; }
  .profile-svg .seen { fill: none; stroke: #ff6a3d; stroke-opacity: .35; stroke-dasharray: 3 3; }
  .profile-svg .pt.locked { fill: var(--ink); }
  .pname .kind { opacity: .6; font-size: .8em; }
  .provenance { position: absolute; inset-inline: 18px; bottom: 64px; margin: 0; padding: 4px 10px; width: fit-content; max-width: calc(100% - 36px); background: color-mix(in srgb, var(--field) 88%, transparent); border-radius: 8px; pointer-events: none; font-size: 12px; }
  .provenance[hidden] { display: none; }
  .profile-svg .body { fill: color-mix(in srgb, var(--ink) 8%, transparent); stroke: var(--ink); stroke-width: 1.5; }
  .profile-svg .pt { fill: #ff6a3d; stroke: #fff; stroke-width: 2; cursor: grab; }
  .btn.drag { cursor: grab; text-decoration: none; border-style: dashed; }
  .btn.drag[hidden] { display: none; }
  .btn.drag:active { cursor: grabbing; }
  .btn.drag.waiting { opacity: .5; pointer-events: none; }
  .lasso polyline { fill: rgb(255 106 61 / .12); stroke: #ff6a3d; stroke-width: 2; stroke-dasharray: 6 4; }
  @media (max-width: 760px) { .tools { top: auto; bottom: 64px; } }
  .choice-set legend { font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 0; margin: 0 0 10px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  .stage { position: relative; min-height: 0; background: radial-gradient(120% 90% at 50% 30%, #f3f5f6 0%, var(--studio) 55%, var(--studio-low) 100%); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .dims { position: absolute; left: 22px; top: 20px; display: flex; align-items: flex-end; gap: 10px; direction: ltr; color: var(--ink); pointer-events: none; }
  html[dir=rtl] .dims { flex-direction: row-reverse; left: auto; right: 22px; }
  .dims div { display: grid; justify-items: center; }
  .dims strong { font-size: 30px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; padding: 0 2px 6px; border-bottom: 1.5px solid var(--ink); position: relative; }
  .dims strong::before, .dims strong::after { content: ""; position: absolute; bottom: -5px; width: 1.5px; height: 9px; background: var(--ink); }
  .dims strong::before { left: 0; } .dims strong::after { right: 0; }
  .dims span { font-size: 12px; color: var(--muted); margin-top: 6px; direction: rtl; }
  html[dir=ltr] .dims span { direction: ltr; }
  .dims i { font-style: normal; color: var(--muted); padding-bottom: 22px; }
  .dims em { font-style: normal; color: var(--muted); font-size: 13px; padding-bottom: 24px; }
  .bar { position: absolute; inset-inline: 18px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .bar .spacer { flex: 1; }
  .btn { font: inherit; font-size: 14px; border-radius: var(--radius-s); padding: 8px 14px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); cursor: pointer; }
  .in-sketchup #glb, .in-sketchup #dae { display: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .sim:empty { display: none; }
  .sim { font-size: 13px; color: var(--muted); background: rgba(251, 251, 252, .82); border-radius: var(--radius-s); padding: 6px 10px; }
  .import { position: absolute; inset-inline-end: 20px; top: 18px; max-width: 300px; font-size: 12.5px; color: var(--muted); text-align: end; margin: 0; }
  .view-note, .file-warn { position: absolute; inset: auto 20px 70px; background: #fff; border: 1px solid var(--bad); color: var(--bad); padding: 10px 12px; border-radius: var(--radius-s); }
  .file-warn { position: fixed; inset: 20px; height: max-content; z-index: 5; font-size: 16px; }
  .compare-view { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 8px; padding: 16px 16px 64px; background: var(--studio); }
  .compare-view img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; border-radius: var(--radius-s); box-shadow: 0 1px 0 var(--rule); }
  .compare-view p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; max-width: 60ch; }
  .box-view img { cursor: crosshair; touch-action: none; user-select: none; }
  .box-rect { position: absolute; border: 2px solid #ff5a28; background: rgba(255, 90, 40, .12); pointer-events: none; }
  [hidden] { display: none !important; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
    .stage { order: -1; height: 58vh; }
    .panel { border: 0; padding: 18px 16px 28px; overflow: visible; }
    .dims strong { font-size: 22px; }
    .dims { left: 14px; top: 12px; } html[dir=rtl] .dims { left: auto; right: 14px; }
    .import { display: none; }
    .bar { inset-inline: 8px; bottom: 8px; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .bar > * { flex: none; }
    .bar .spacer { display: none; }
    .sim { display: none; }
    .btn { padding: 7px 10px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <div>
        <h1 data-t="title">استوديو AIM للمجسمات</h1>
        <p class="sub" data-t="sub"></p>
      </div>
      <button class="lang" id="lang" type="button" data-t="lang">English</button>
    </header>

    <section>
      <h2 data-t="photo"></h2>
      <div class="drop" id="drop" role="button" tabindex="0">
        <div class="pic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
          <img id="thumb" alt="">
        </div>
        <div>
          <b class="when-empty" data-t="drop"></b>
          <b class="when-has" data-t="change"></b>
          <small data-t="dropHint"></small>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <p class="note" id="seeState" aria-live="polite"></p>
      <label class="check" id="seeAIRow"><input type="checkbox" id="seeAI"> <span data-t="seeAI"></span></label>
      <p class="note" id="seeAIState" aria-live="polite"></p>
      <div class="field key" id="geminiRow" hidden>
        <label class="name" for="gemini" data-t="gemini"></label>
        <div class="row"><input type="password" id="gemini" autocomplete="off" spellcheck="false" dir="ltr"><button class="btn" id="geminiSave" type="button" data-t="tokenSave"></button></div>
        <p class="hint" data-t="geminiHint"></p>
        <button class="link" id="geminiForget" type="button" data-t="geminiForget" hidden></button>
      </div>
      <button class="link" id="geminiChange" type="button" data-t="geminiChange" hidden></button>
      <div class="analysis" id="analysis" hidden>
        <h3 data-t="anTitle"></h3>
        <p class="an-name" id="anName"></p>
        <p class="note" id="anProduct" hidden></p>
        <a class="link" id="anSearch" target="_blank" rel="noopener noreferrer" data-t="anSearch" hidden></a>
        <label class="check" id="anConfirmRow" hidden><input type="checkbox" id="anConfirm"> <span data-t="anConfirm"></span></label>
        <p class="hint" id="anDesc"></p>
        <ul class="an-parts" id="anParts"></ul>
        <p class="note" id="anSize"></p>
        <button class="link" id="anUseSize" type="button" data-t="anUseSize" hidden></button>
        <ul class="an-issues" id="anIssues"></ul>
        <p class="hint" id="anTip"></p>
        <p class="an-by" id="anBy"></p>
      </div>
      <p class="note" id="fitState" aria-live="polite"></p>
      <button class="link" id="pickBox" type="button" data-t="pickBox" hidden></button>
      <div class="row"><progress id="seeBar" max="1" value="0" hidden></progress><button class="link" id="skipSee" type="button" data-t="seeSkip" hidden></button></div>
    </section>

    <section>
      <h2 id="typeLabel" data-t="type"></h2>
      <select id="type" aria-labelledby="typeLabel"></select>
    </section>

    <section id="optsBox">
      <h2 data-t="options"></h2>
      <div id="opts"></div>
    </section>

    <section id="aiBox" hidden>
      <p class="hint" data-t="aiNote"></p>
      <div class="views" id="viewsBox">
        <p class="name" data-t="viewsTitle"></p>
        <div class="slots">
          <label class="slot" data-side="back"><img alt="" hidden><span data-t="vBack"></span><input type="file" accept="image/*" hidden></label>
          <label class="slot" data-side="left"><img alt="" hidden><span data-t="vLeft"></span><input type="file" accept="image/*" hidden></label>
          <label class="slot" data-side="right"><img alt="" hidden><span data-t="vRight"></span><input type="file" accept="image/*" hidden></label>
        </div>
        <div class="row wrap">
          <button class="link" id="videoPick" type="button" data-t="videoPick"></button><input type="file" id="videoFile" accept="video/*" hidden>
          <button class="link" id="swapLR" type="button" data-t="swapLR" hidden></button>
          <button class="link" id="clearViews" type="button" data-t="clearViews" hidden></button>
        </div>
        <p class="hint" data-t="viewsHint"></p>
      </div>
      <div class="row wrap"><button class="btn primary" id="aiMake" type="button" data-t="aiMake"></button><button class="btn" id="aiBest" type="button" data-t="aiBest"></button><button class="btn" id="aiLite" type="button" data-t="aiLite"></button><button class="btn" id="aiProfile" type="button" data-t="aiProfile"></button><button class="btn" id="aiCancel" type="button" data-t="aiCancel" hidden></button></div>
      <p class="hint" data-t="aiBestHint"></p>
      <label class="check"><input type="checkbox" id="aiAuto"> <span data-t="aiAuto"></span></label>
      <p class="note" id="aiState" aria-live="polite"></p>
      <div class="cands" id="aiResults" hidden></div>
      <div class="field" id="tokenRow" hidden>
        <label class="name" for="token" data-t="token"></label>
        <div class="row"><input type="password" id="token" autocomplete="off" dir="ltr"><button class="btn" id="tokenSave" type="button" data-t="tokenSave"></button></div>
      </div>
    </section>

    <section id="editBox" hidden>
      <h2 data-t="editTitle"></h2>
      <p class="hint" data-t="editHint"></p>
      <ul class="parts" id="partsList"></ul>
      <p class="note" id="editState"></p>
      <div class="pair-box" id="pairBox" hidden>
        <span class="name" data-t="pairTitle"></span>
        <div class="row wrap"><button class="btn" id="pairFind" type="button"></button><span class="hint" id="pairCount"></span></div>
        <label class="check"><input type="checkbox" id="pairLink" checked> <span data-t="pairLink"></span></label>
        <label class="field"><span class="name" data-t="snapDist"></span><input type="text" inputmode="decimal" id="snapDist" value="2" dir="ltr"></label>
        <p class="hint" data-t="snapHint"></p>
      </div>
      <div id="partFields" hidden>
        <span class="name" data-t="pPos"></span>
        <div class="sizes"><label><span>X</span><input type="text" inputmode="decimal" id="pX" dir="ltr"></label><label><span>Y</span><input type="text" inputmode="decimal" id="pY" dir="ltr"></label><label><span>Z</span><input type="text" inputmode="decimal" id="pZ" dir="ltr"></label></div>
        <span class="name" data-t="pSize"></span>
        <div class="sizes"><label><span data-t="w"></span><input type="text" inputmode="decimal" id="pW" dir="ltr"></label><label><span data-t="d"></span><input type="text" inputmode="decimal" id="pD" dir="ltr"></label><label><span data-t="h"></span><input type="text" inputmode="decimal" id="pH" dir="ltr"></label></div>
        <label class="check"><input type="checkbox" id="pRatio"> <span data-t="pRatio"></span></label>
        <label class="field"><span class="name" data-t="pTurn"></span><input type="text" inputmode="decimal" id="pR" dir="ltr"></label>
        <div class="row wrap"><button class="btn" id="pDup" type="button" data-t="pDup"></button><button class="btn" id="pMirror" type="button" data-t="pMirror"></button><button class="btn" id="pHide" type="button" data-t="pHide"></button><button class="btn" id="pDel" type="button" data-t="pDel"></button></div>
        <div class="pair-box" id="pairOwn"><p class="note" id="pairOf" hidden></p><button class="link" id="pairUnlink" type="button" data-t="pairUnlink" hidden></button></div>
        <span class="name" data-t="shapeTools"></span>
        <div class="row wrap"><button class="btn" id="sCut" type="button" data-t="sCut"></button><button class="btn" id="sLasso" type="button" data-t="sLasso"></button><button class="btn" id="sSplit" type="button" data-t="sSplit"></button></div>
        <div class="row wrap"><button class="btn" id="sClean" type="button" data-t="sClean"></button><button class="btn" id="sSmooth" type="button" data-t="sSmooth"></button><button class="btn" id="sLighter" type="button" data-t="sLighter"></button></div>
        <label class="check"><input type="checkbox" id="lassoThrough"> <span data-t="lassoThrough"></span></label>
        <div class="profile-box" id="profileBox" hidden>
          <span class="name" data-t="prTitle"></span>
          <svg id="profileSvg" class="profile-svg"></svg>
          <p class="hint" data-t="prHint"></p>
          <div class="sizes"><label><span data-t="prH"></span><input type="text" inputmode="decimal" id="prH" dir="ltr"></label><label><span data-t="prD"></span><input type="text" inputmode="decimal" id="prD" dir="ltr"></label><label><span data-t="prTop"></span><input type="text" inputmode="decimal" id="prTop" dir="ltr"></label></div>
          <div class="sizes"><label><span data-t="prBase"></span><input type="text" inputmode="decimal" id="prBase" dir="ltr"></label><label><span data-t="prWall"></span><input type="text" inputmode="decimal" id="prWall" dir="ltr"></label><label><span data-t="prSeg"></span><input type="text" inputmode="numeric" id="prSeg" dir="ltr"></label></div>
          <label class="check"><input type="checkbox" id="prHollow"> <span data-t="prHollow"></span></label>
          <button class="link" id="prReset" type="button" data-t="prReset"></button>
          <p class="hint" id="prSideNote"></p>
          <button class="btn" id="prSwap" type="button" hidden></button>
        </div>
        <div class="cut-box" id="cutBox" hidden>
          <div class="row"><span data-t="cutAcross"></span><button class="tool" type="button" data-axis="z" data-t="axisZ"></button><button class="tool" type="button" data-axis="x" data-t="axisX"></button><button class="tool" type="button" data-axis="y" data-t="axisY"></button></div>
          <input type="range" id="cutAt" min="1" max="99" value="50">
          <div class="row"><button class="btn primary" id="cutGo" type="button" data-t="cutGo"></button><button class="btn" id="cutCancel" type="button" data-t="cutCancel"></button></div>
        </div>
      </div>
      <div class="row wrap"><button class="link" id="mTurn" type="button" data-t="mTurn"></button><button class="link" id="mSide" type="button" data-t="mSide"></button><button class="link" id="mFloor" type="button" data-t="mFloor"></button><button class="link" id="mShowAll" type="button" data-t="mShowAll"></button></div>
      <p class="note" id="editNote" data-t="editNote" hidden></p>
    </section>

    <section>
      <h2 data-t="size"></h2>
      <div class="sizes">
        <label><span data-t="w"></span><input type="text" inputmode="decimal" id="w" dir="ltr"></label>
        <label><span data-t="d"></span><input type="text" inputmode="decimal" id="d" dir="ltr"></label>
        <label><span data-t="h"></span><input type="text" inputmode="decimal" id="h" dir="ltr"></label>
      </div>
      <p class="hint" data-t="sizeHint2"></p>
      <p class="note bad" id="senseNote" hidden></p>
      <button class="link" id="refit" type="button" data-t="refit"></button>
      <button class="link" id="exactAI" type="button" data-t="exactAI" hidden></button>
      <button class="link" id="judge" type="button" data-t="judge" hidden></button>
      <p class="note" id="judgeState" aria-live="polite"></p>
      <ul class="judge-list" id="judgeList" hidden></ul>
    </section>

    <section>
      <label class="field"><span class="name" data-t="quality"></span>
        <select id="quality"><option value="light" data-t="light" selected></option><option value="standard" data-t="standard"></option><option value="high" data-t="high"></option></select>
      </label>
      <p class="note" id="buildState" aria-live="polite"></p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="view" aria-label="3D"></canvas>
    <div class="dims" id="dims" hidden>
      <div><strong id="dimW"></strong><span data-t="w"></span></div><i>×</i>
      <div><strong id="dimD"></strong><span data-t="d"></span></div><i>×</i>
      <div><strong id="dimH"></strong><span data-t="h"></span></div><em>cm</em>
    </div>
    <svg class="lasso" id="lasso" hidden><polyline points="" /></svg>
    <div class="tools" id="tools" hidden>
      <button class="tool" type="button" data-mode="translate" data-t="tMove"></button>
      <button class="tool" type="button" data-mode="rotate" data-t="tTurn"></button>
      <button class="tool" type="button" data-mode="scale" data-t="tScale"></button>
      <span class="sep"></span>
      <button class="tool" id="tUndo" type="button" data-t="tUndo"></button>
      <button class="tool" id="tRedo" type="button" data-t="tRedo"></button>
    </div>
    <p class="import" id="importHint" data-t="importHint"></p>
    <div class="compare-view box-view" id="boxView" hidden>
      <img id="boxImg" alt="" draggable="false">
      <div class="box-rect" id="boxRect" hidden></div>
      <p data-t="boxNote"></p>
      <div class="row"><button class="btn primary" id="useBox" type="button" data-t="useBox" disabled></button><button class="btn" id="cancelBox" type="button" data-t="cancelBox"></button></div>
    </div>
    <div class="compare-view" id="compareView" hidden>
      <img id="compareImg" alt="">
      <p data-t="compareNote"></p>
      <button class="btn" id="closeCompare" type="button" data-t="closeCompare"></button>
    </div>
    <div class="view-note" id="viewNote" role="alert" hidden></div>
    <div class="bar">
      <button class="btn" id="settle" type="button" data-t="settle" hidden></button>
      <button class="btn" id="stopSim" type="button" data-t="stop" hidden></button>
      <span class="sim" id="simState" aria-live="polite"></span>
      <button class="link" id="folds" type="button" data-t="folds" hidden></button>
      <span class="spacer"></span>
      <button class="btn" id="compare" type="button" data-t="compare" hidden></button>
      <button class="btn" id="editSel" type="button" data-t="editSel" hidden></button>
      <button class="btn primary" id="insert" type="button" data-t="insert" hidden></button>
      <a class="btn drag" id="dragOut" href="#" draggable="true" data-t="dragOut" hidden></a>
      <button class="btn primary" id="glb" type="button" data-t="glb"></button>
      <button class="btn" id="dae" type="button" data-t="dae"></button>
      <button class="btn" id="saveProject" type="button" data-t="saveProject"></button>
      <button class="link" id="openProject" type="button" data-t="openProject"></button><input type="file" id="projectFile" accept=".aim3d,application/json" hidden>
    </div>
    <p class="hint provenance" id="provenance" hidden></p>
  </main>
</div>
<div class="file-warn" id="fileWarn" role="alert" hidden></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
