<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو AIM للمجسمات</title>
<meta name="description" content="صورة قطعة أثاث إلى مجسم ثلاثي الأبعاد لسكتشب، على جهازك.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e6a6e'/%3E%3Cpath d='M6 21h20v4H6zM8 14h16a2 2 0 0 1 2 2v5H6v-5a2 2 0 0 1 2-2zM9 8h6v6H9z' fill='%23fff'/%3E%3C/svg%3E">
<script>
  // Errors are reported to the SketchUp extension (when the page runs inside it), so a problem in SketchUp's own
  // browser can be read from its log. A classic script: it runs even when a module fails to load.
  (function () {
    var sent = 0;
    function send(kind, msg) {
      if (sent > 50 || !/host=sketchup/.test(location.search)) return;
      var tries = 0;
      (function go() {
        if (window.sketchup && window.sketchup.aim3d_log) { sent++; window.sketchup.aim3d_log(JSON.stringify({ kind: kind, msg: String(msg).slice(0, 2000) })); }
        else if (tries++ < 80) setTimeout(go, 100);
      })();
    }
    window.addEventListener('error', function (e) { send('error', (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); }, true);
    window.addEventListener('unhandledrejection', function (e) { send('rejection', e.reason && (e.reason.stack || e.reason.message) || e.reason); });
    window.aim3dReport = send;
    // Inside SketchUp there is no offline mode: its browser's Cache Storage never answers, and a service worker
    // installed by an earlier visit would make the page wait for it. Remove it, and reload once if it was in control.
    if (/host=sketchup/.test(location.search) && navigator.serviceWorker) {
      var controlled = !!navigator.serviceWorker.controller;
      var done = function () { if (controlled && !/[?&]nosw=1/.test(location.search)) location.replace(location.href + '&nosw=1'); };
      try {
        Promise.race([
          navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
          new Promise(function (ok) { setTimeout(ok, 1500); })
        ]).then(done, done);
      } catch (e) { done(); }
    }
  })();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<style>
  :root {
    color-scheme: light;
    --studio: #e4e8eb;
    --studio-low: #c9cfd4;
    --panel: #fbfbfc;
    --ink: #1f2b35;
    --muted: #5b6a76;
    --rule: #d5dbe0;
    --field: #ffffff;
    --accent: #2e6a6e;
    --accent-soft: #e3eeee;
    --bad: #a33a2a;
    --radius-s: 6px;
    --radius-m: 10px;
    --font: "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--panel); color: var(--ink); font: 15px/1.5 var(--font); }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  .panel { overflow-y: auto; padding: 22px 22px 28px; border-inline-end: 1px solid var(--rule); background: var(--panel); }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 21px; line-height: 1.25; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 13.5px; }
  .lang { flex: none; border: 1px solid var(--rule); background: var(--field); color: var(--ink); border-radius: var(--radius-s); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  section { padding: 16px 0; border-top: 1px solid var(--rule); }
  h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
  .drop { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 14px; padding: 12px; border: 1.5px dashed #a9b3bb; border-radius: var(--radius-m); background: var(--field); cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop .pic { width: 72px; height: 72px; border-radius: var(--radius-s); background: var(--studio) center / cover no-repeat; display: grid; place-items: center; overflow: hidden; }
  .drop .pic img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .drop.has .pic img { display: block; }
  .drop .pic svg { width: 30px; height: 30px; color: var(--muted); }
  .drop.has .pic svg { display: none; }
  .drop b { display: block; font-weight: 600; font-size: 14px; }
  .drop small { color: var(--muted); font-size: 12.5px; }
  .drop .when-has { display: none; } .drop.has .when-has { display: inline; } .drop.has .when-empty { display: none; }
  .note { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .note.bad { color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field .name { font-size: 13.5px; }
  .seen { font-style: normal; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; margin-inline-start: 4px; }
  select, input[type=text], input[type=password] { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 7px 9px; }
  .sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sizes label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .sizes input { direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .choice { display: flex; gap: 6px; flex-wrap: wrap; }
  .choice label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 6px 10px; background: var(--field); font-size: 13.5px; cursor: pointer; }
  .choice input:disabled + span { color: #9aa5ae; }
  .choice-set { border: 0; padding: 0; margin: 0; }
  .choice-set legend { font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 0; margin: 0 0 10px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  .stage { position: relative; min-height: 0; background: radial-gradient(120% 90% at 50% 30%, #f3f5f6 0%, var(--studio) 55%, var(--studio-low) 100%); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .dims { position: absolute; left: 22px; top: 20px; display: flex; align-items: flex-end; gap: 10px; direction: ltr; color: var(--ink); pointer-events: none; }
  html[dir=rtl] .dims { flex-direction: row-reverse; left: auto; right: 22px; }
  .dims div { display: grid; justify-items: center; }
  .dims strong { font-size: 30px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; padding: 0 2px 6px; border-bottom: 1.5px solid var(--ink); position: relative; }
  .dims strong::before, .dims strong::after { content: ""; position: absolute; bottom: -5px; width: 1.5px; height: 9px; background: var(--ink); }
  .dims strong::before { left: 0; } .dims strong::after { right: 0; }
  .dims span { font-size: 12px; color: var(--muted); margin-top: 6px; direction: rtl; }
  html[dir=ltr] .dims span { direction: ltr; }
  .dims i { font-style: normal; color: var(--muted); padding-bottom: 22px; }
  .dims em { font-style: normal; color: var(--muted); font-size: 13px; padding-bottom: 24px; }
  .bar { position: absolute; inset-inline: 18px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .bar .spacer { flex: 1; }
  .btn { font: inherit; font-size: 14px; border-radius: var(--radius-s); padding: 8px 14px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); cursor: pointer; }
  .in-sketchup #glb, .in-sketchup #dae { display: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .sim:empty { display: none; }
  .sim { font-size: 13px; color: var(--muted); background: rgba(251, 251, 252, .82); border-radius: var(--radius-s); padding: 6px 10px; }
  .import { position: absolute; inset-inline-end: 20px; top: 18px; max-width: 300px; font-size: 12.5px; color: var(--muted); text-align: end; margin: 0; }
  .view-note, .file-warn { position: absolute; inset: auto 20px 70px; background: #fff; border: 1px solid var(--bad); color: var(--bad); padding: 10px 12px; border-radius: var(--radius-s); }
  .file-warn { position: fixed; inset: 20px; height: max-content; z-index: 5; font-size: 16px; }
  .compare-view { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 8px; padding: 16px 16px 64px; background: var(--studio); }
  .compare-view img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; border-radius: var(--radius-s); box-shadow: 0 1px 0 var(--rule); }
  .compare-view p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; max-width: 60ch; }
  .box-view img { cursor: crosshair; touch-action: none; user-select: none; }
  .box-rect { position: absolute; border: 2px solid #ff5a28; background: rgba(255, 90, 40, .12); pointer-events: none; }
  [hidden] { display: none !important; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
    .stage { order: -1; height: 58vh; }
    .panel { border: 0; padding: 18px 16px 28px; overflow: visible; }
    .dims strong { font-size: 22px; }
    .dims { left: 14px; top: 12px; } html[dir=rtl] .dims { left: auto; right: 14px; }
    .import { display: none; }
    .bar { inset-inline: 8px; bottom: 8px; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .bar > * { flex: none; }
    .bar .spacer { display: none; }
    .sim { display: none; }
    .btn { padding: 7px 10px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <div>
        <h1 data-t="title">استوديو AIM للمجسمات</h1>
        <p class="sub" data-t="sub"></p>
      </div>
      <button class="lang" id="lang" type="button" data-t="lang">English</button>
    </header>

    <section>
      <h2 data-t="photo"></h2>
      <div class="drop" id="drop" role="button" tabindex="0">
        <div class="pic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
          <img id="thumb" alt="">
        </div>
        <div>
          <b class="when-empty" data-t="drop"></b>
          <b class="when-has" data-t="change"></b>
          <small data-t="dropHint"></small>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <p class="note" id="seeState" aria-live="polite"></p>
      <p class="note" id="fitState" aria-live="polite"></p>
      <button class="link" id="pickBox" type="button" data-t="pickBox" hidden></button>
      <div class="row"><progress id="seeBar" max="1" value="0" hidden></progress><button class="link" id="skipSee" type="button" data-t="seeSkip" hidden></button></div>
    </section>

    <section>
      <h2 id="typeLabel" data-t="type"></h2>
      <select id="type" aria-labelledby="typeLabel"></select>
    </section>

    <section id="optsBox">
      <h2 data-t="options"></h2>
      <div id="opts"></div>
    </section>

    <section id="aiBox" hidden>
      <p class="hint" data-t="aiNote"></p>
      <div class="row"><button class="btn primary" id="aiMake" type="button" data-t="aiMake"></button><button class="btn" id="aiCancel" type="button" data-t="aiCancel" hidden></button></div>
      <p class="note" id="aiState" aria-live="polite"></p>
      <div class="field" id="tokenRow" hidden>
        <label class="name" for="token" data-t="token"></label>
        <div class="row"><input type="password" id="token" autocomplete="off" dir="ltr"><button class="btn" id="tokenSave" type="button" data-t="tokenSave"></button></div>
      </div>
    </section>

    <section>
      <h2 data-t="size"></h2>
      <div class="sizes">
        <label><span data-t="w"></span><input type="text" inputmode="decimal" id="w" dir="ltr"></label>
        <label><span data-t="d"></span><input type="text" inputmode="decimal" id="d" dir="ltr"></label>
        <label><span data-t="h"></span><input type="text" inputmode="decimal" id="h" dir="ltr"></label>
      </div>
      <p class="hint" data-t="sizeHint2"></p>
      <p class="note bad" id="senseNote" hidden></p>
      <button class="link" id="refit" type="button" data-t="refit"></button>
      <button class="link" id="exactAI" type="button" data-t="exactAI" hidden></button>
    </section>

    <section>
      <label class="field"><span class="name" data-t="quality"></span>
        <select id="quality"><option value="light" data-t="light" selected></option><option value="standard" data-t="standard"></option><option value="high" data-t="high"></option></select>
      </label>
      <fieldset class="choice-set">
        <legend data-t="colour"></legend>
        <div class="choice">
          <label><input type="radio" name="colour" value="white" checked><span data-t="white"></span></label>
          <label><input type="radio" name="colour" value="photo" id="colourPhoto" disabled><span data-t="photoColours"></span></label>
        </div>
      </fieldset>
      <p class="note" id="buildState" aria-live="polite"></p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="view" aria-label="3D"></canvas>
    <div class="dims" id="dims" hidden>
      <div><strong id="dimW"></strong><span data-t="w"></span></div><i>×</i>
      <div><strong id="dimD"></strong><span data-t="d"></span></div><i>×</i>
      <div><strong id="dimH"></strong><span data-t="h"></span></div><em>cm</em>
    </div>
    <p class="import" id="importHint" data-t="importHint"></p>
    <div class="compare-view box-view" id="boxView" hidden>
      <img id="boxImg" alt="" draggable="false">
      <div class="box-rect" id="boxRect" hidden></div>
      <p data-t="boxNote"></p>
      <div class="row"><button class="btn primary" id="useBox" type="button" data-t="useBox" disabled></button><button class="btn" id="cancelBox" type="button" data-t="cancelBox"></button></div>
    </div>
    <div class="compare-view" id="compareView" hidden>
      <img id="compareImg" alt="">
      <p data-t="compareNote"></p>
      <button class="btn" id="closeCompare" type="button" data-t="closeCompare"></button>
    </div>
    <div class="view-note" id="viewNote" role="alert" hidden></div>
    <div class="bar">
      <button class="btn" id="settle" type="button" data-t="settle" hidden></button>
      <button class="btn" id="stopSim" type="button" data-t="stop" hidden></button>
      <span class="sim" id="simState" aria-live="polite"></span>
      <button class="link" id="folds" type="button" data-t="folds" hidden></button>
      <span class="spacer"></span>
      <button class="btn" id="compare" type="button" data-t="compare" hidden></button>
      <button class="btn" id="editSel" type="button" data-t="editSel" hidden></button>
      <button class="btn primary" id="insert" type="button" data-t="insert" hidden></button>
      <button class="btn primary" id="glb" type="button" data-t="glb"></button>
      <button class="btn" id="dae" type="button" data-t="dae"></button>
    </div>
  </main>
</div>
<div class="file-warn" id="fileWarn" role="alert" hidden></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
